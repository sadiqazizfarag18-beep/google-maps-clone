<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خريطة - Maps Clone 🗺️</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://leaflet-cdn.s3.amazonaws.com/content/leaflet/master/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- الشريط العلوي -->
        <div class="top-bar">
            <div class="logo">
                <i class="fas fa-map"></i>
                <span>Maps</span>
            </div>
            <div class="search-section">
                <input type="text" id="searchInput" placeholder="ابحث عن مكان...">
                <button id="searchBtn"><i class="fas fa-search"></i></button>
            </div>
            <div class="top-buttons">
                <button id="currentLocationBtn" title="موقعي الحالي"><i class="fas fa-location-arrow"></i></button>
                <button id="menuBtn" title="القائمة"><i class="fas fa-bars"></i></button>
            </div>
        </div>

        <div class="main-content">
            <!-- الخريطة -->
            <div id="map" class="map-container"></div>

            <!-- الشريط الجانبي -->
            <div class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <h2>المعلومات</h2>
                    <button class="close-sidebar" onclick="toggleSidebar()"><i class="fas fa-times"></i></button>
                </div>

                <!-- نتائج البحث -->
                <div id="searchResults" class="search-results"></div>

                <!-- معلومات المكان -->
                <div id="placeInfo" class="place-info" style="display: none;">
                    <div class="place-header">
                        <h3 id="placeName"></h3>
                        <span id="placeRating" class="rating"></span>
                    </div>
                    <p id="placeAddress" class="place-address"></p>
                    <div class="place-details">
                        <div class="detail-item">
                            <i class="fas fa-phone"></i>
                            <span id="placePhone">غير متوفر</span>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-globe"></i>
                            <span id="placeWebsite">غير متوفر</span>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-clock"></i>
                            <span id="placeHours">غير متوفر</span>
                        </div>
                    </div>
                    <button id="saveToFavorites" class="save-btn"><i class="fas fa-heart"></i> حفظ</button>
                    <button id="getDirections" class="directions-btn"><i class="fas fa-directions"></i> احصل على المسار</button>
                </div>

                <!-- المفضلة -->
                <div id="favorites" class="favorites-section" style="display: none;">
                    <h3>المفضلة ⭐</h3>
                    <div id="favoritesList" class="favorites-list"></div>
                </div>
            </div>

            <!-- لوحة التحكم السفلية -->
            <div class="bottom-panel" id="bottomPanel" style="display: none;">
                <div class="panel-header">
                    <h3>المسار</h3>
                    <button class="close-panel" onclick="closeBottomPanel()"><i class="fas fa-times"></i></button>
                </div>
                <div id="directionsInfo" class="directions-info"></div>
            </div>
        </div>
    </div>

    <!-- Modal للمزيد من الخيارات -->
    <div id="optionsModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>الخيارات</h2>
            <div class="modal-buttons">
                <button onclick="toggleFavorites()"><i class="fas fa-heart"></i> المفضلة</button>
                <button onclick="changeMapStyle()"><i class="fas fa-palette"></i> تغيير النمط</button>
                <button onclick="showAbout()"><i class="fas fa-info-circle"></i> حول التطبيق</button>
                <button onclick="clearAllData()"><i class="fas fa-trash"></i> حذف البيانات</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
